events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # API rate limiting (per client IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 80;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        location /api/auth {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_auth auth-service:4001;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$upstream_auth$uri$is_args$args;
            proxy_http_version 1.1;
        }

        location /api/bots {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_bots bots-service:4002;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_bots$uri$is_args$args;
            proxy_http_version 1.1;
        }

        location /api/ai {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_ai ai-proxy-service:4003;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_ai$uri$is_args$args;
            proxy_http_version 1.1;
        }

        location /api/billing {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_billing billing-service:4004;
            rewrite ^/api/billing/(.*)$ /$1 break;
            proxy_pass http://$upstream_billing$uri$is_args$args;
            proxy_http_version 1.1;
        }

        location /api/support {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_support support-service:4005;
            rewrite ^/api/support/(.*)$ /$1 break;
            proxy_pass http://$upstream_support$uri$is_args$args;
            proxy_http_version 1.1;
        }

        location /api/templates {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_templates support-service:4005;
            proxy_pass http://$upstream_templates$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/admin/templates {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_admin_templates support-service:4005;
            proxy_pass http://$upstream_admin_templates$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/admin {
            limit_req zone=api_limit burst=60 nodelay;
            set $upstream_admin support-service:4005;
            rewrite ^/api/admin/(.*)$ /$1 break;
            proxy_pass http://$upstream_admin$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            set $upstream_frontend frontend:80;
            proxy_pass http://$upstream_frontend$uri$is_args$args;
            proxy_http_version 1.1;
        }
    }
}
